spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/resume_trainer?serverTimezone=UTC}
    username: ${DB_USER:trainer}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: 8080
  address: 127.0.0.1 # localhost only (README)
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.springframework.web: INFO # never DEBUG: it can print request bodies (trd 6.5)
