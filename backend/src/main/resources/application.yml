spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/resume_trainer?serverTimezone=UTC}
    username: ${DB_USER:trainer}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:
  jwt:
    secret: ${JWT_SECRET:} # at least 32 bytes; the app refuses to start without it
  cookie:
    secure: false # true only if the app is ever served over HTTPS
  ai: # keys come from GROQ_API_KEY and GOOGLE_AI_KEY (trd 6.6)
    timeout-seconds: 20
    whisper-timeout-seconds: 40
    models: # unverified placeholders, check current IDs before the first real call
      groq-chat: llama-3.3-70b-versatile
      groq-whisper: whisper-large-v3-turbo
      gemma: gemma-3-27b-it
server:
  port: 8080
  address: 127.0.0.1 # localhost only (README)
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.springframework.web: INFO # never DEBUG: it can print request bodies (trd 6.5)
